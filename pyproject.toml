[project]
name = "shieldbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amanda Karunathilaka", email = "amandakarunathilaka111@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.32.0",
    "ipykernel>=7.4.0",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
shieldbot = "shieldbot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
